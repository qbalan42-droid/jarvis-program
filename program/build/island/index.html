<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Source Island</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Manrope:wght@400;600;700;800&display=swap">
<style>
/* Source Island (blank). One committed look: a dark glass HUD floating over the 3D island. Tokens here; everything else derives. */
:root{
  --bg:#0b1a24; --glass:rgba(10,22,30,.72); --glass2:rgba(10,22,30,.9); --line:rgba(255,255,255,.12);
  --ink:#eef3f1; --mut:#9fb0b4; --gold:#f2c46d; --teal:#5fd2c4; --rose:#ff7a90; --leaf:#8fd68a; --sky:#8fb6ff;
  --fD:'Big Shoulders Display','Arial Narrow',Impact,sans-serif; --fB:Manrope,system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--fB);overflow:hidden;-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;display:block}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
button{font:inherit;color:inherit;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:9px;padding:7px 12px;cursor:pointer}
button:hover{background:rgba(255,255,255,.14)}button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.gold{background:var(--gold);color:#1b1407;border-color:transparent;font-weight:800}
input,select,textarea{font:inherit;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:transparent}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--gold);padding:0}
small{color:var(--mut)}
#loading{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--bg);transition:opacity .7s}
#loading .t{font:800 54px/1 var(--fD);letter-spacing:.04em;text-transform:uppercase}#loading .t i{color:var(--gold);font-style:normal}
#loading .s{font:700 12px var(--fB);letter-spacing:.2em;color:var(--mut);margin-top:8px;text-align:center}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
#hud>*{pointer-events:auto}
#title{position:absolute;left:12px;top:calc(env(safe-area-inset-top,0px) + 12px);padding:12px 16px;min-width:230px;max-width:min(360px,calc(100vw - 24px))}
#title .n{font:800 30px/1 var(--fD);letter-spacing:.03em;text-transform:uppercase}
#title .m{font-size:12px;color:var(--mut);margin-top:4px;max-width:34ch}
#title .d{display:flex;gap:14px;align-items:center;margin-top:10px}
#title .d b{font:800 26px/1 var(--fD)}#title .d small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase}
#title .lt{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font:800 18px var(--fD);background:rgba(255,255,255,.16)}
#num{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);padding:12px 16px;min-width:250px;max-width:min(340px,calc(100vw - 24px))}
#num .lbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
#num .v{font:800 34px/1.05 var(--fD);color:var(--gold);font-variant-numeric:tabular-nums}
#num .tier{font-weight:700;margin-top:6px}#num .bar{height:6px;border-radius:4px;background:rgba(255,255,255,.1);margin:8px 0 4px;overflow:hidden}#num .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--gold))}
#num .row{display:flex;gap:8px;align-items:center;margin-top:8px}#num .row input{width:120px}
#now{position:absolute;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding:12px 16px;min-width:230px;max-width:min(320px,calc(100vw - 24px))}
#now .k{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}#now .b{font:800 22px/1.1 var(--fD);margin-top:2px}
#now .c{font:800 30px/1 var(--fD);color:var(--teal);margin-top:4px;font-variant-numeric:tabular-nums}#now .nx{font-size:12px;color:var(--mut);margin-top:6px}
#now .btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}#now .btns button{padding:5px 9px;font-size:12px}
#today{position:absolute;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(400px,calc(100vw - 24px));max-height:calc(100vh - 260px);overflow:auto;padding:14px 16px}
#today h3{font:800 20px/1 var(--fD);letter-spacing:.03em;text-transform:uppercase;margin:0 0 8px}
#today h4{font:700 10px var(--fB);letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
.item{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}.item:first-of-type{border-top:0}
.item label{flex:1;min-width:0}.item .lv{font-size:11px;color:var(--mut);white-space:nowrap}.item input[type=number]{width:72px;padding:4px 7px}
.item.on label{color:var(--leaf)}
#labels{position:fixed;inset:0;pointer-events:none;z-index:4}
.lab{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;background:var(--glass2);border:1px solid var(--line);border-radius:10px;padding:5px 9px;white-space:nowrap;font-size:12px;line-height:1.25}
.lab b{display:block;font:800 14px var(--fD);letter-spacing:.04em;text-transform:uppercase}.lab small{display:block;font-size:10px}
.lab .lvp{display:inline-block;margin-left:6px;padding:0 6px;border-radius:999px;background:rgba(242,196,109,.18);color:var(--gold);font-weight:800;font-size:10px}
#toast{position:fixed;left:50%;top:14%;transform:translateX(-50%);z-index:30;padding:14px 22px;text-align:center;display:none;max-width:min(520px,calc(100vw - 32px))}
#toast b{display:block;font:800 26px/1 var(--fD);color:var(--gold);letter-spacing:.03em;text-transform:uppercase}
/* modal (interview, milestones, data) */
#modal{position:fixed;inset:0;z-index:40;background:rgba(4,10,14,.66);display:none;place-items:center;padding:14px;overflow:auto}
#modal.open{display:grid}
#modal .box{width:min(680px,100%);max-height:calc(100vh - 28px);overflow:auto;padding:22px 24px}
#modal h2{font:800 30px/1 var(--fD);letter-spacing:.03em;text-transform:uppercase;margin:0 0 4px}
#modal .step{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
#modal .help{color:var(--mut);margin:0 0 14px;max-width:62ch}
#modal .f{display:grid;gap:8px;margin:10px 0}#modal .f label{display:grid;gap:4px;font-size:12px;color:var(--mut)}
#modal .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
#modal .arow{display:grid;grid-template-columns:22px 1.2fr 1.3fr 90px 70px;gap:6px;align-items:center;padding:4px 0;border-top:1px solid var(--line)}
#modal .arow:first-child{border-top:0}
#modal .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
#modal textarea{width:100%;min-height:160px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}
#modal table{width:100%;border-collapse:collapse;font-size:13px}#modal td,#modal th{padding:6px 8px;border-top:1px solid var(--line);text-align:left;vertical-align:top}#modal th{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);border-top:0}
#modal td input{width:100%}
.ok{color:var(--leaf)}.warn{color:var(--gold)}.bad{color:var(--rose)}
@media (max-width:760px){
  #title{min-width:0;max-width:calc(100vw - 24px);right:12px}#num{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);left:12px;right:12px;max-width:none;min-width:0}
  #now{left:12px;right:12px;max-width:none;bottom:calc(env(safe-area-inset-bottom,0px) + 12px)}#today{display:none;left:12px;right:12px;width:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-height:70vh}
  body.sheet #today{display:block}body.sheet #now,body.sheet #num{display:none}
  #modal .arow{grid-template-columns:22px 1fr 1fr;grid-auto-rows:auto}#modal .arow select,#modal .arow input[type=number]{grid-column:span 1}
}
@media (prefers-reduced-motion:reduce){#loading{transition:none}}
</style>
</head>
<body>
<div id="loading"><div><div class="t"><i>SOURCE</i> ISLAND</div><div class="s">A 3D PLACE THAT GROWS WITH YOUR DAYS</div></div></div>
<div id="labels"></div>
<div id="hud">
  <div id="title" class="glass"><div class="n" id="tName">Source Island</div><div class="m" id="tMission">Answer the interview to raise your island.</div>
    <div class="d"><div><b id="dayN">—</b><small>day of run</small></div><div><b id="kept">—</b><small>days kept</small></div><div class="lt" id="letter" title="Today's letter: F full day · L floor kept · X missed · S rest">—</div></div></div>
  <div id="num" class="glass"><div class="lbl" id="numLbl">The number</div><div class="v" id="numV">—</div><div class="tier" id="tier">—</div><div class="bar"><i id="tBar" style="width:0%"></i></div><small id="tNext">—</small>
    <div class="row"><input type="number" id="numIn" placeholder="update" step="any" aria-label="New value"><button id="numSet">Log</button><button id="msBtn" title="Milestones and rewards">Milestones</button></div></div>
  <div id="now" class="glass"><div class="k" id="nowK">Now</div><div class="b" id="nowB">—</div><div class="c" id="nowC">--:--</div><div class="nx" id="nowN"></div>
    <div class="btns"><button id="todayBtn">Today</button><button id="ivBtn">Interview</button><button id="dataBtn">Data</button><button id="audioBtn" title="Ocean sound">Sound</button></div></div>
  <div id="today" class="glass"><h3 id="tdH">Today</h3><div id="tdBody"></div><div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap"><button id="closeSheet">Back to the island</button></div></div>
</div>
<div id="toast" class="glass"><b id="toastT">Upgraded</b><span id="toastS"></span></div>
<div id="modal"><div class="box glass" id="mbox"></div></div>
<script>
// ===================== STATE · everything lives in this browser (localStorage). Export from the Data panel to back it up. =====================
const LS = "sourceIsland.v1";
const pad = (n) => String(n).padStart(2, "0");
const localDate = (d = new Date()) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const PRESETS = [
  ["faith", "Faith", "Prayer and reading", "check", 1, "chapel"], ["body", "Body", "Trained or walked", "check", 1, "gym"],
  ["work", "Work", "Deep work hours", "count", 4, "office"], ["money", "Money", "One money action", "check", 1, "bank"],
  ["mind", "Mind", "Pages read", "count", 20, "library"], ["craft", "Craft", "Made or shipped something", "check", 1, "studio"],
  ["home", "Home", "Order, food, rest", "check", 1, "home"], ["people", "People", "Reached out to someone", "check", 1, "pavilion"]];
const BLOCK_DEFAULTS = [["09:00", "10:45", "Block 1"], ["11:00", "12:30", "Block 2"], ["13:00", "15:30", "Block 3"], ["16:30", "18:00", "Block 4"]];
function freshState() {
  return { v: 1, setup: false, created: localDate(),
    profile: { island: "Source Island", mission: "", source: "", runDays: 90, runStart: localDate(), wake: "06:00", lights: "23:00", restDay: 0, restNote: "", identity: "", missRule: "", teacher: "" },
    number: { label: "Net worth", unit: "$", start: 0, goal: 10000, by: "" },
    areas: PRESETS.slice(0, 6).map(([k, name, label, type, target, style]) => ({ k, name, label, type, target, style })),
    floor: [{ k: "f1", label: "Up by wake time" }, { k: "f2", label: "Prayer or stillness" }, { k: "f3", label: "First work block started" }, { k: "f4", label: "Moved the body 20 min" }, { k: "f5", label: "Lights out on time" }],
    blocks: BLOCK_DEFAULTS.map(([t, end, name]) => ({ t, end, name })), cuts: ["", "", ""], people: ["", ""], rewards: {},
    ledger: {}, hist: [], seenTier: -1 };
}
let S = (() => { try { const j = JSON.parse(localStorage.getItem(LS) || "null"); if (j && j.v === 1) return Object.assign(freshState(), j); } catch (e) {} return freshState(); })();
function save() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) { console.warn("could not save", e); } window.dispatchEvent(new CustomEvent("island:update")); }
const todayKey = () => localDate();
const L = (date = todayKey()) => (S.ledger[date] = S.ledger[date] || { floor: {}, areas: {}, blocks: {} });
const fmtNum = (v) => { const u = S.number.unit || ""; const n = Number(v) || 0; const s = Math.abs(n) >= 1000 ? n.toLocaleString("en-US", { maximumFractionDigits: 0 }) : n.toLocaleString("en-US", { maximumFractionDigits: 2 }); return u === "$" || u === "€" || u === "£" ? u + s : s + (u ? " " + u : ""); };
function numberNow() { const h = S.hist; return h.length ? h[h.length - 1].value : S.number.start; }
function progress() { const a = Number(S.number.start), b = Number(S.number.goal), v = numberNow(); if (b === a) return v >= b ? 1 : 0; return Math.max(0, Math.min(1.5, (v - a) / (b - a))); }
const TIERS = [[0, "Castaway", "a driftwood shack and a rowboat"], [0.1, "Beachcomber", "the first real rooms"], [0.25, "Islander", "a villa takes shape"], [0.5, "Homesteader", "gardens and a proper harbour"], [0.75, "Harbourmaster", "a marina and a lighthouse"], [1, "Arrived", "the whole island lit"]];
function tierOf(p = progress()) { let t = 0; TIERS.forEach((x, i) => { if (p >= x[0]) t = i; }); return t; }
function dayN(date = todayKey()) { const a = new Date(S.profile.runStart + "T12:00:00"), b = new Date(date + "T12:00:00"); return Math.floor((b - a) / 864e5) + 1; }
function isRest(date = todayKey()) { const rd = S.profile.restDay; if (rd === -1 || rd === "-1" || rd === "") return false; return new Date(date + "T12:00:00").getDay() === Number(rd); }
function areaMet(a, Ld) { const v = Ld.areas[a.k]; return a.type === "check" ? !!v : (Number(v) || 0) >= Number(a.target || 1); }
function letterFor(date) {
  if (date < S.created || dayN(date) < 1) return "—"; if (date > todayKey()) return "·"; if (isRest(date)) return "S";
  const Ld = S.ledger[date]; if (!Ld) return date < todayKey() ? "X" : "—";
  const floorAll = S.floor.every(f => Ld.floor[f.k]), areasAll = S.areas.every(a => areaMet(a, Ld));
  if (floorAll && areasAll) return "F"; if (floorAll) return "L"; return date < todayKey() ? "X" : "—";
}
const LCOL = { F: "#f2c46d", L: "#8fd68a", X: "#ff7a90", S: "#8fb6ff", "—": "rgba(255,255,255,.18)", "·": "#2a3940" };
function daysKept() { let n = 0; for (const d in S.ledger) { const l = letterFor(d); if (l === "F" || l === "L") n++; } return n; }
function areaDays(a) { let n = 0; for (const d in S.ledger) if (areaMet(a, S.ledger[d])) n++; return n; }
const AREA_LV = [0, 3, 7, 14, 30, 60]; const lvl = (v, steps) => { let L0 = 0; steps.forEach((s, i) => { if (v >= s) L0 = i; }); return L0; };
function areaLevel(a) { return lvl(areaDays(a), AREA_LV); }
function toMin(t) { const [h, m] = String(t || "0:0").split(":").map(Number); return h * 60 + (m || 0); }
function nowBlock() { const n = new Date(), m = n.getHours() * 60 + n.getMinutes(); const bs = S.blocks.filter(b => b.t && b.end); const cur = bs.find(b => m >= toMin(b.t) && m < toMin(b.end)); const next = bs.filter(b => toMin(b.t) > m).sort((a, b) => toMin(a.t) - toMin(b.t))[0]; return { cur, next, m }; }
// ===================== HUD =====================
const $ = (id) => document.getElementById(id);
function toast(t, s) { $("toastT").textContent = t; $("toastS").textContent = s || ""; $("toast").style.display = "block"; clearTimeout(toast._t); toast._t = setTimeout(() => $("toast").style.display = "none", 5000); }
function renderHUD() {
  const p = S.profile; $("tName").textContent = p.island || "Source Island"; $("tMission").textContent = p.mission || "Answer the interview to raise your island.";
  const dn = dayN(); $("dayN").textContent = (dn >= 1 ? dn : 0) + "/" + p.runDays; $("kept").textContent = daysKept();
  const lt = letterFor(todayKey()); $("letter").textContent = lt; $("letter").style.background = LCOL[lt] || LCOL["—"]; $("letter").style.color = lt === "F" || lt === "L" || lt === "S" ? "#10202a" : "";
  const pr = progress(), t = tierOf(pr), nx = TIERS[t + 1]; $("numLbl").textContent = S.number.label || "The number"; $("numV").textContent = fmtNum(numberNow());
  $("tier").textContent = TIERS[t][1] + " · tier " + t + " · " + TIERS[t][2]; $("tBar").style.width = Math.min(100, pr * 100) + "%";
  $("tNext").textContent = nx ? "Next at " + fmtNum(Number(S.number.start) + (Number(S.number.goal) - Number(S.number.start)) * nx[0]) + ": " + nx[1] + ", " + nx[2] : "Goal reached. Set a new one in the interview.";
  if (S.seenTier >= 0 && t > S.seenTier) { toast("Island upgraded", TIERS[t][1] + " · " + TIERS[t][2]); } if (t !== S.seenTier) { S.seenTier = t; try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} }
  tickNow(); renderToday();
}
function tickNow() {
  const { cur, next, m } = nowBlock(), n = new Date();
  if (isRest()) { $("nowK").textContent = "Rest day"; $("nowB").textContent = S.profile.restNote || "The island rests with you"; $("nowC").textContent = pad(n.getHours()) + ":" + pad(n.getMinutes()); $("nowN").textContent = ""; return; }
  if (cur) { const left = toMin(cur.end) - m - 1 + (60 - n.getSeconds()) / 60; const mm = Math.max(0, Math.floor(left)), ss = Math.max(0, Math.floor((left - mm) * 60)); $("nowK").textContent = "Now · " + cur.t + "–" + cur.end; $("nowB").textContent = cur.name; $("nowC").textContent = pad(mm) + ":" + pad(ss) + " left"; $("nowN").textContent = next ? "Next: " + next.t + " " + next.name : "Last block of the day"; }
  else { $("nowK").textContent = pad(n.getHours()) + ":" + pad(n.getMinutes()); $("nowB").textContent = next ? "Next block " + next.t : m < toMin(S.profile.wake) ? "Before wake time" : "Blocks done"; $("nowC").textContent = next ? pad(Math.floor((toMin(next.t) - m) / 60)) + ":" + pad((toMin(next.t) - m) % 60) + " to go" : "—"; $("nowN").textContent = next ? next.name : (S.profile.lights ? "Lights out " + S.profile.lights : ""); }
}
setInterval(tickNow, 1000);
function renderToday() {
  const Ld = L(), d = todayKey(); let h = "";
  h += `<h4>The floor · never zero</h4>` + S.floor.map(f => `<div class="item ${Ld.floor[f.k] ? "on" : ""}"><input type="checkbox" id="fl-${f.k}" data-floor="${f.k}" ${Ld.floor[f.k] ? "checked" : ""}><label for="fl-${f.k}">${esc(f.label)}</label></div>`).join("");
  h += `<h4>Life areas · each one is a building</h4>` + S.areas.map(a => { const on = areaMet(a, Ld); return `<div class="item ${on ? "on" : ""}">` + (a.type === "check" ? `<input type="checkbox" id="ar-${a.k}" data-area="${a.k}" ${Ld.areas[a.k] ? "checked" : ""}><label for="ar-${a.k}">${esc(a.name)} · ${esc(a.label)}</label>` : `<input type="number" id="ar-${a.k}" data-areanum="${a.k}" value="${Ld.areas[a.k] || ""}" placeholder="0" min="0" step="any"><label for="ar-${a.k}">${esc(a.name)} · ${esc(a.label)} <small>/ ${a.target}</small></label>`) + `<span class="lv">lv ${areaLevel(a)} · ${areaDays(a)} days</span></div>`; }).join("");
  if (S.blocks.some(b => b.t)) h += `<h4>Blocks</h4>` + S.blocks.filter(b => b.t).map((b, i) => `<div class="item ${Ld.blocks[i] ? "on" : ""}"><input type="checkbox" id="bk-${i}" data-block="${i}" ${Ld.blocks[i] ? "checked" : ""}><label for="bk-${i}">${b.t}–${b.end} ${esc(b.name)}</label></div>`).join("");
  h += `<h4>Note for today</h4><textarea id="noteIn" rows="2" style="width:100%" placeholder="One line. What happened, what you learned.">${esc(Ld.note || "")}</textarea>`;
  if (S.profile.missRule && Object.values(S.ledger).length && letterFor(prevDay(d)) === "X") h += `<div class="item" style="border-top:0;margin-top:8px"><span class="bad">Yesterday was a miss.</span>&nbsp;<small>${esc(S.profile.missRule)}</small></div>`;
  $("tdH").textContent = "Today · " + new Date(d + "T12:00:00").toLocaleDateString("en-US", { weekday: "long", month: "short", day: "numeric" });
  $("tdBody").innerHTML = h;
}
const esc = (s) => String(s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const prevDay = (d) => { const x = new Date(d + "T12:00:00"); x.setDate(x.getDate() - 1); return localDate(x); };
document.addEventListener("change", (e) => {
  const t = e.target, Ld = L(); if (t.dataset.floor) Ld.floor[t.dataset.floor] = t.checked; else if (t.dataset.area) Ld.areas[t.dataset.area] = t.checked; else if (t.dataset.areanum) Ld.areas[t.dataset.areanum] = Number(t.value) || 0; else if (t.dataset.block) Ld.blocks[t.dataset.block] = t.checked; else if (t.id === "noteIn") Ld.note = t.value; else return;
  save(); renderHUD();
});
